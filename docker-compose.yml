version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL — primary relational database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medisync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medisync_db
      POSTGRES_USER: medisync_user
      POSTGRES_PASSWORD: medisync_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisync_user -d medisync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis — caching, queue broker, WebSocket sessions
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medisync_redis
    restart: unless-stopped
    command: redis-server --requirepass medisync_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "medisync_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # MinIO — S3-compatible object storage for medical images
  # ─────────────────────────────────────────────
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: medisync_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medisync_minio
      MINIO_ROOT_PASSWORD: medisync_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisync_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
